# Replace bridge.example.com with your PUBLIC_URL host, or download it pre-filled from ${PUBLIC_URL}/setup
# Hub app for chatwoot-slack-inbox: admin sign-in, agent linking, user lookups.
# Each bridged channel gets its own Slack app; the control panel generates those.
display_information:
  name: "Chatwoot Inbox Bridge"
  description: "Sign-in and account linking for the Chatwoot Slack inbox bridge. Unofficial."
  background_color: "#1f93ff"
features:
  bot_user:
    display_name: "Chatwoot Inbox Bridge"
    always_online: false
oauth_config:
  redirect_urls:
    - https://bridge.example.com/link/callback
    - https://bridge.example.com/admin/callback
  scopes:
    user:
      - chat:write
      - files:write
    bot:
      - users:read
      - users:read.email
settings:
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
