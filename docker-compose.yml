services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    env_file: .env
    environment:
      DATABASE_URL: postgres://chatwoot_slack:chatwoot_slack@db:5432/chatwoot_slack
      PORT: "3000"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: chatwoot_slack
      POSTGRES_PASSWORD: chatwoot_slack
      POSTGRES_DB: chatwoot_slack
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chatwoot_slack -d chatwoot_slack"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
